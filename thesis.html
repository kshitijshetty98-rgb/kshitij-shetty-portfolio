<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corked Up & Thesis — Ar. Kshitij Shetty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --text:#141414;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:var(--bg); }
  body{
    color:var(--text);
    font-family:'Playfair Display', serif;
    overflow-x:hidden;
  }

  .back-link{
    position:fixed;
    top:24px;
    left:24px;
    z-index:10;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:.85rem;
    letter-spacing:.04em;
    color:#f4f3ef;
    text-decoration:none;
    mix-blend-mode:difference;
  }
  .back-link:hover{ opacity:.75; }

  .thesis-hero{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:#000;
    overflow:hidden;
  }
  .thesis-hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:scale(1.004); /* closes a subpixel rounding seam that can show at the contain-fit edge */
  }
  .thesis-hero-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 78%, #fff 100%);
    pointer-events:none;
  }

  .thesis-board{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .thesis-board img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  @media (max-width:768px){
    .thesis-board{
      height:auto;
      padding:0;
    }
    .thesis-board:first-of-type{
      padding-top:72px;
    }
    .thesis-board img{
      height:auto;
      display:block;
    }
  }
</style>
</head>
<body>

  <a class="back-link" href="index.html">← Back</a>

  <section class="thesis-hero" id="corkedHero" style="background:#c1a78a;">
    <img src="images/corked-hero.jpg" alt="Corked Up — Upcycling Cork Waste into Complex Geometric Panels">

<script>
  function setupHeroFade(heroEl){
    if(!heroEl) return;
    function onScroll(){
      const vh = window.innerHeight;
      const start = heroEl.offsetTop;
      const progress = Math.max(0, Math.min(1, (window.scrollY - start) / vh));
      heroEl.style.opacity = String(1 - progress);
    }
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
  }
  setupHeroFade(document.getElementById('corkedHero'));
  setupHeroFade(document.getElementById('thesisHero'));
</script>
