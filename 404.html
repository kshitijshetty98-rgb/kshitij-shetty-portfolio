<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#141414">
<title>Page not found — Ar. Kshitij Shetty</title>
<meta name="description" content="The page you're looking for doesn't exist.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/kshitij-shetty-portfolio/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/kshitij-shetty-portfolio/images/favicon-16.png">
<link rel="apple-touch-icon" href="/kshitij-shetty-portfolio/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --text:#141414;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:var(--bg); height:100%; }
  body{
    color:var(--text);
    font-family:'Playfair Display', serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10vh 6vw;
  }
  .error-code{
    font-size:clamp(.8rem, 1.6vw, .95rem);
    letter-spacing:.14em;
    color:var(--text);
    opacity:.5;
    margin-bottom:22px;
  }
  h1{
    font-weight:500;
    font-size:clamp(2.1rem, 5.6vw, 3.6rem);
    line-height:1.15;
    margin-bottom:20px;
    letter-spacing:.01em;
  }
  p{
    font-size:clamp(.95rem, 1.6vw, 1.1rem);
    color:var(--text);
    opacity:.65;
    margin:0 auto 40px;
    max-width:38ch;
    line-height:1.6;
  }
  a.home-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:.9rem;
    letter-spacing:.04em;
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid var(--text);
    padding-bottom:3px;
    transition:opacity .3s ease;
  }
  a.home-link:hover{ opacity:.6; }
</style>
</head>
<body>
  <main>
    <p class="error-code">404 — PAGE NOT FOUND</p>
    <h1>This page wandered off the drawing board.</h1>
    <p>The page you're looking for doesn't exist, or may have moved.</p>
    <a class="home-link" href="/kshitij-shetty-portfolio/">← Back to the portfolio</a>
  </main>
</body>
</html>
