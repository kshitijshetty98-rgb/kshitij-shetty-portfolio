<meta property="og:description" content="Miscellaneous work by Ar. Kshitij Shetty — an interior photoshoot, artwork, a design competition entry, and extracurricular highlights.">
<meta property="og:image" content="https://kshitijshetty98-rgb.github.io/kshitij-shetty-portfolio/images/misc-hero.jpg">
<meta property="og:url" content="https://kshitijshetty98-rgb.github.io/kshitij-shetty-portfolio/misc.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Miscellaneous — Ar. Kshitij Shetty">
<meta name="twitter:description" content="Miscellaneous work by Ar. Kshitij Shetty — an interior photoshoot, artwork, a design competition entry, and extracurricular highlights.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --text:#141414;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:var(--bg); }
  body{
    color:var(--text);
    font-family:'Playfair Display', serif;
    overflow-x:hidden;
  }

  .back-link{
    position:fixed;
    top:24px;
    left:24px;
    z-index:10;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:.85rem;
    letter-spacing:.04em;
    color:#f4f3ef;
    text-decoration:none;
    mix-blend-mode:difference;
  }
  .back-link:hover{ opacity:.75; }

  .thesis-hero{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:#000;
    overflow:hidden;
  }
  .thesis-hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:scale(1.004); /* closes a subpixel rounding seam that can show at the contain-fit edge */
  }
  .thesis-hero-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 78%, #fff 100%);
    pointer-events:none;
  }

  #miscHero{ background:#5a5a5a; }
  /* on viewports wider (relative to height) than the artwork's own ratio, object-fit:contain
     letterboxes left/right instead of top/bottom — keep that margin clean white, not gray */
  @media (min-aspect-ratio: 1749/1000){
    #miscHero{ background:#ffffff; }
  }

  .hero-title{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:2;
    margin:0;
    width:92%;
    text-align:center;
    line-height:1;
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-size:clamp(2.4rem, 9vw, 8rem);
    letter-spacing:.03em;
    color:#fff;
    text-shadow:0 4px 34px rgba(0,0,0,.3);
  }

  /* ---------- portrait boards, shown as side-by-side spreads to match the
     landscape-board density used elsewhere on the other project pages ---------- */
  .residential-spread{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2%;
  }
  .residential-spread img{
    height:100%;
    width:auto;
    max-width:48%;
    object-fit:contain;
    display:block;
    flex:none;
  }

  @media (max-width:768px){
    .residential-spread{
      height:auto;
      display:block;
      gap:0;
    }
    .residential-spread img{
      width:100%;
      max-width:100%;
      height:auto;
    }
  }
</style>
</head>
<body>

  <a class="back-link" href="index.html#indexSection">← Back</a>

  <section class="thesis-hero" id="miscHero">
    <img src="images/misc-hero.jpg" alt="Miscellaneous — architecture portfolio">
    <h1 class="hero-title">Miscellaneous</h1>
    <div class="thesis-hero-fade"></div>
  </section>

  <section class="residential-spread">
    <img src="images/misc-1.jpg" loading="lazy" alt="Interior photoshoot, Mumbai 2200 sqft apartment, board 1">
    <img src="images/misc-2.jpg" loading="lazy" alt="Interior photoshoot, Mumbai 2200 sqft apartment, board 2">
  </section>
  <section class="residential-spread">
    <img src="images/misc-3.jpg" loading="lazy" alt="Interior photoshoot, Mumbai 2200 sqft apartment, board 3">
    <img src="images/misc-4.jpg" loading="lazy" alt="Interior photoshoot, Mumbai 2200 sqft apartment, board 4">
  </section>
  <section class="residential-spread">
    <img src="images/misc-5.jpg" loading="lazy" alt="Artwork — illustrations on social and pandemic themes">
    <img src="images/misc-6.jpg" loading="lazy" alt="Design competition entry — waste station at Mahuli Fort">
  </section>
  <section class="residential-spread">
    <img src="images/misc-7.jpg" loading="lazy" alt="Extracurriculars — football and cricket team captaincy, community outreach">
    <img src="images/misc-8.jpg" loading="lazy" alt="Community interaction space design and build, before and after">
  </section>

<script>
  function setupHeroFade(heroEl){
    if(!heroEl) return;
    function onScroll(){
      const vh = window.innerHeight;
      const start = heroEl.offsetTop;
      const progress = Math.max(0, Math.min(1, (window.scrollY - start) / vh));
      heroEl.style.opacity = String(1 - progress);
    }
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
  }
  setupHeroFade(document.getElementById('miscHero'));

  // came from the homepage: step back in history so the browser restores the exact
  // scroll position; otherwise the link's href lands on the project grid
  document.querySelector('.back-link').addEventListener('click', (e) => {
    const home = new URL('./', location.href).pathname;
    const from = document.referrer ? new URL(document.referrer) : null;
    const cameFromHome = from && from.origin === location.origin &&
      (from.pathname === home || from.pathname === home + 'index.html');
    if(cameFromHome && history.length > 1){
      e.preventDefault();
      history.back();
    }
  });
</script>

</body>
</html>
