  .residential-spread{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2%;
  }
  .residential-spread img{
    height:100%;
    width:auto;
    max-width:48%;
    object-fit:contain;
    display:block;
    flex:none;
  }

  @media (max-width:768px){
    .residential-spread{
      height:auto;
      display:block;
      gap:0;
    }
    .residential-spread img{
      width:100%;
      max-width:100%;
      height:auto;
    }
  }

  /* ---------- landscape slide boards (After Gaudi deck): a full-viewport board
     whose slide image keeps its exact aspect ratio so absolutely-positioned
     video/GIF overlays can be placed with percentages that always land on the
     right pixels of the slide, at any viewport size. Ported verbatim (same
     class shape + same magic width numbers) from group.html's Rammed Chair
     slide-deck treatment, so a slide's on-screen width matches across pages ---------- */
  .thesis-board{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .thesis-board img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  @media (max-width:768px){
    .thesis-board{
      height:auto;
      padding:0;
    }
    .thesis-board img{
      height:auto;
      display:block;
    }
  }

  /* Rammed-style boards' own frame is height:auto (not the shared 100vh
     .thesis-board default) so slides stack with ZERO gap. Width formula copied
     exactly from group.html: min(95.01vw, 75.34vh * 16/9) -- see that file's CSS
     comment for the full derivation; same figures keep a slide's on-screen
     width equal across both pages. No max-height clamp on the frame: that
     distorts the 16:9 shape and crops the overlays. overflow:hidden added
     (group.html's Rammed Chair frame never needed it) because one After Gaudi
     overlay's pptx position bleeds slightly past the slide edge by design --
     Google Slides itself clips content to the slide boundary, so this frame
     must too. */
  .thesis-board:has(.deck-frame){
    height:auto;
  }
  .thesis-board .deck-frame{
    position:relative;
    width:min(95.01vw, calc(75.34vh * 16 / 9));
    max-width:min(95.01vw, calc(75.34vh * 16 / 9));
    aspect-ratio:1.777778;
    overflow:hidden;
  }
  .thesis-board .deck-frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .thesis-board .deck-frame video.deck-media{
    position:absolute;
    object-fit:cover;
    background:#000;
  }
  /* small caption/label patches that sit ON TOP of a video overlay, matching the
     deck's own z-order where a text label is drawn after (in front of) its GIF --
     without this, the video would otherwise paint over and hide that label once
     the gif's own background goes non-black. Cropped directly from the pristine
     slide render, so they always show exactly what the deck shows. */
  .thesis-board .deck-frame img.deck-caption{
    position:absolute;
    display:block;
    pointer-events:none;
  }
  /* breathing room at the two section joins the gap removal above would
     otherwise close flush: hero -> first deck slide, last deck slide -> first
     residential spread. Same 6vh figure used on group.html. */
  #gaudiFirst{ margin-top:6vh; }
  #gaudiLast{ margin-bottom:6vh; }

<script>
  function setupHeroFade(heroEl){
    if(!heroEl) return;
    function onScroll(){
      const vh = window.innerHeight;
      const start = heroEl.offsetTop;
      const progress = Math.max(0, Math.min(1, (window.scrollY - start) / vh));
      heroEl.style.opacity = String(1 - progress);
    }
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
  }
  setupHeroFade(document.getElementById('miscHero'));

  // After Gaudi slide videos: play while a clip is scrolled into view, pause
  // when it isn't, and leave the poster frame showing for reduced-motion users
  // or whenever play() is blocked.
  (function setupDeckMedia(){
    const clips = document.querySelectorAll('video.deck-media');
    if(!clips.length) return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const v = entry.target;
        if(entry.isIntersecting){
          const p = v.play();
          if(p && p.catch) p.catch(() => {});
        } else {
          v.pause();
        }
      });
    }, { threshold: 0.25 });
    clips.forEach((v) => io.observe(v));
  })();

  // came from the homepage: step back in history so the browser restores the exact
  // scroll position; otherwise the link's href lands on the project grid
  document.querySelector('.back-link').addEventListener('click', (e) => {
    const home = new URL('./', location.href).pathname;
    const from = document.referrer ? new URL(document.referrer) : null;
    const cameFromHome = from && from.origin === location.origin &&
      (from.pathname === home || from.pathname === home + 'index.html');
    if(cameFromHome && history.length > 1){
      e.preventDefault();
      history.back();
    }
  });
</script>
