<style>
  :root{
    --bg:#ffffff;
    --text:#141414;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:var(--bg); height:100%; }
  body{
    color:var(--text);
    font-family:'Playfair Display', serif;
    overflow-x:hidden;
  }

  .welcome{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh; /* avoids iOS/Android address-bar resize jump */
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .welcome-frame{
    position:relative;
    width:100%;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
  }

  .welcome-frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    animation:fadeInImage 3.6s ease-out forwards;
  }

  .hero-mobile{ display:none; }

  @media (max-width:768px){
    .hero-desktop{ display:none; }
    .hero-mobile{
      display:block;
      object-position:center 18%; /* keep faces/paper-cutouts in frame on tall phone screens */
    }
  }

  .welcome-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    /* fades to the skills band's grey (not white) so the photo meets the band with no seam */
    background:linear-gradient(to bottom, rgba(239,239,237,0) 0%, rgba(239,239,237,.9) 78%, #efefed 100%);
    pointer-events:none;
  }

  @keyframes fadeInImage{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  .welcome-text{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:clamp(48px, 9vh, 140px);
    text-align:center;
    pointer-events:none;
    color:#fff;
  }

  .text-block{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 64px;
  }

  .eyebrow-line{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    opacity:0;
    transform:translateY(40px);
    animation:slideUp 1.8s cubic-bezier(.16,1,.3,1) 1.6s forwards;
  }
  .eyebrow-line .bar{
    width:1px;
    height:1.4em;
    background:rgba(255,255,255,.65);
  }
  .eyebrow-line span{
    font-size:clamp(1.3rem, 2.5vw, 2.1rem);
    font-weight:400;
    letter-spacing:.02em;
    white-space:nowrap;
  }

  .name-line{
    position:relative;
    opacity:0;
    transform:translateY(70px);
    animation:slideUp 1.9s cubic-bezier(.16,1,.3,1) 2.1s forwards;
  }
  .name-line span{
    display:block;
    font-size:clamp(3.8rem, 12vw, 10.5rem);
    font-weight:600;
    line-height:1.05;
    letter-spacing:-.01em;
    white-space:nowrap;
  }

  @keyframes slideUp{
    from{ opacity:0; transform:translateY(60px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:640px){
    .name-line span{ font-size:clamp(2.6rem, 13vw, 4.6rem); white-space:normal; }
    .eyebrow-line span{ font-size:1.15rem; white-space:normal; }
    .text-block{ padding:24px 28px; }
  }

  /* ---------- TIMELINE (pinned horizontal pan) ---------- */
  .section-spacer{
    width:100%;
    height:22vh;
    background:#fff;
  }

  .timeline-section{
    position:relative;
    height:400vh;
    background:#fff;
  }
  .timeline-sticky{
    position:sticky;
    top:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .timeline-track{
    position:relative;
    height:100%;
    width:max-content;
    will-change:transform;
  }
  .timeline-track video{
    height:100%;
    width:auto;
    display:block;
  }

  /* ---------- MOBILE: swap scroll-jacked pan for a native swipeable strip;
     the strip's own scrollLeft scrubs the video instead of window scrollY ---------- */
  @media (max-width:768px){
    .section-spacer{ height:2vh; }

    .timeline-section{
      height:auto;
    }
    .timeline-sticky{
      position:relative;
      top:auto;
      width:100%;
      height:auto;
      overflow-x:auto;
      overflow-y:hidden;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .timeline-sticky::-webkit-scrollbar{ display:none; }
    .timeline-track{
      /* 150% scale = 1.5x original size -> ~26% of width visible at start */
      height:calc(75vw / 0.4945);
    }
  }

  /* ---------- SKILLS BAND (attached under the hero photo, shares its first-viewport
     opacity fade via #welcome — see onScroll) ---------- */
  .skills-band{
    flex:0 0 auto;
    position:relative;
    background:#efefed;
    padding:clamp(16px, 3vh, 30px) 5vw clamp(20px, 3.6vh, 34px);
  }
  .skills-list{
    list-style:none;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    justify-items:center;
    gap:clamp(16px, 2.6vh, 26px) 6vw;
    max-width:460px;
    margin:0 auto;
  }
  .skill{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    text-align:center;
    min-width:0;
  }
  .skill-ring{
    position:relative;
    width:clamp(48px, 15vw, 66px);
    height:clamp(48px, 15vw, 66px);
    flex:none;
  }
  .skill-ring svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform:rotate(-90deg); /* progress arc starts at 12 o'clock */
    overflow:visible;
  }
  .ring-track{ fill:none; stroke:#dcdcda; stroke-width:7; }
  .ring-progress{ fill:none; stroke:#5c5c5c; stroke-width:7; stroke-linecap:round; }
  .skill-logo{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    width:42%;
    height:42%;
    object-fit:contain;
    /* forces every vendor mark to the same flat charcoal grey regardless of source colour */
    filter:brightness(0) invert(36%);
  }
  /* Rhino's line-art reads too small at the default logo size; the Revit mark is already
     pre-tinted to grey (it needs its 3 facets to stay readable) so it skips the filter */
  .skill[data-app="rhino"] .skill-logo{ width:52%; height:52%; }
  .skill[data-app="revit"] .skill-logo{ filter:none; }
  .skill-label{
    font-family:'Playfair Display', serif;
    line-height:1.35;
  }
  .skill-name{
    display:block;
    font-size:clamp(.64rem, 2.6vw, .76rem);
    letter-spacing:.02em;
    color:var(--text);
  }
  .skill-score{
    display:block;
    font-size:clamp(.58rem, 2.2vw, .68rem);
    color:var(--text);
    opacity:.55;
  }

  @media (min-width:1024px){
    .skills-band{ padding:clamp(18px, 3vh, 30px) 3vw; }
    .skills-list{
      display:flex;
      flex-wrap:nowrap;
      justify-content:center;
      align-items:flex-start;
      gap:clamp(12px, 2.2vw, 34px);
      max-width:1360px;
    }
    .skill{ flex:0 1 auto; max-width:108px; }
    .skill-ring{ width:clamp(50px, 4.4vw, 74px); height:clamp(50px, 4.4vw, 74px); }
    .skill-name{ font-size:clamp(.68rem, 1.05vw, .8rem); }
    .skill-score{ font-size:clamp(.6rem, .85vw, .7rem); }
  }

  @media (max-width:767px){
    /* on phones, squashing the hero to also fit the band in the first viewport crops the
       photo badly, so the band sits directly under the full-height photo instead */
    .welcome{ height:auto; overflow:visible; }
    .welcome-frame{ flex:none; height:100vh; height:100dvh; }
    .skills-list{ max-width:340px; gap:22px 7vw; }
  }

  /* ---------- MAIN INDEX ---------- */
  /* gaps/side padding are sized to (just over) a tile video's white left margin
     (86/704 of the tile width), so a video's margin fills its own gap without
     painting over the neighbouring tile */
  .index-section{
    display:flex;
    width:100%;
    height:100vh;
    height:100dvh;
    gap:1.875%;
    background:#fff;
    padding:0 1.81%;
  }
  .index-col{
    flex:1;
    position:relative;
    background:var(--col-color);
    overflow:hidden;
    cursor:pointer;
  }
  .index-col img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:top center;
    display:block;
  }
  /* video tiles: the video canvas has a white margin left of and above the tile panel.
     Size/offset it so the panel lands exactly on the tile and the margin hangs outside,
     letting the pop-up art spill past the tile's left/top edges; the right/bottom edges
     still clip. Geometry in source px: --cw/--ch canvas size, --px/--py panel top-left,
     --pw panel width (the panel always runs to the canvas's right and bottom edges).
     Defaults fit the 790x3004 exports; a tile can override them inline. */
  .index-col.has-video{
    overflow:visible;
    clip-path:inset(-100vh 0 0 -100vw);
  }
  .index-col .idx-video{
    --cw:790; --ch:3004; --px:86; --py:153; --pw:704;
    position:absolute;
    top:0;
    left:calc(var(--px) / var(--pw) * -100%);
    width:calc(var(--cw) / var(--pw) * 100%);
    height:auto;
    aspect-ratio:var(--cw) / var(--ch);
    margin-top:calc(var(--py) / var(--pw) * -100%); /* % margins resolve against width, like left */
    display:block;
    pointer-events:none;
  }
  .index-col .idx-base{
    opacity:1;
  }
  .index-col .idx-hover{
    opacity:0;
    transition:opacity .5s ease;
  }
  .index-col:hover .idx-hover,
  .index-col.is-active .idx-hover{
    opacity:1;
  }
  @media (hover:hover) and (pointer:fine){
    .index-col:active .idx-hover{
      opacity:.85;
      transition:opacity .1s ease;
    }
  }
  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @media (max-width:900px){
    /* column gaps fit a video's left margin; row gap and top padding fit its top
       margin (up to 154/703 of the tile width), so row 2's upward spill clears row 1 */
    .index-section{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      grid-auto-rows:auto;
      height:auto;
      column-gap:3.82%;
      row-gap:6.4vw;
      padding:6.4vw 3.65% 3.65%;
    }
    .index-col{
      aspect-ratio:706 / 2850; /* same proportions as the source index artwork - no cropping needed */
      min-height:0;
    }
    .index-col img{
      object-position:top center;
    }
  }

  /* ---------- CONTACT ---------- */
  .contact{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:var(--bg);
    padding:10vh 6vw;
    margin-top:clamp(40px, 7vh, 110px);
    overflow:hidden;
  }
  .contact-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .contact-scrim{
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.55);
    z-index:0;
  }
  .contact-fade-top{
    position:absolute;
    top:0; left:0; right:0;
    height:16%;
    background:linear-gradient(to bottom, #fff 0%, rgba(255,255,255,0) 100%);
    z-index:0;
    pointer-events:none;
  }
  .contact-inner{ position:relative; z-index:1; max-width:900px; }
  .contact-eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    font-size:clamp(.85rem, 1.3vw, 1.1rem);
    letter-spacing:.02em;
    color:var(--text);
    margin-bottom:16px;
  }
  .contact-eyebrow .bar{
    width:1px;
    height:1.2em;
    background:var(--text);
    opacity:.5;
  }
  .contact-email{
    display:inline-block;
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(1.8rem, 5vw, 3.6rem);
    color:var(--text);
    text-decoration:none;
    border-bottom:2px solid transparent;
    transition:border-color .3s ease;
  }

  @media (max-width:640px){
    .contact-email{
      font-size:clamp(1.3rem, 6.8vw, 2rem);
      white-space:nowrap;
    }
  }
  .contact-email:hover{
    border-color:var(--text);
  }
</style>
</head>

<script>
  const indexCategories = [
    {
      key:'thesis', base:'images/idx-thesis-base.jpg', video:'images/idx-thesis.mp4', poster:'images/idx-thesis-poster.jpg',
      title:'Thesis',
      desc:'Final thesis was a detail study of religion and its structures. Understanding and an attempt to create a space with a joint true meaning.',
      link:'thesis.html'
    },
    {
      key:'commercial', base:'images/idx-commercial-base.jpg', video:'images/idx-commercial.mp4', poster:'images/idx-commercial-poster.jpg',
      title:'Commercial',
      desc:'Projects include an I.T park with an expansive podium landscape and also project with small pockets of green spaces created in space constraints.',
      link:'commercial.html'
    },
    {
      key:'residential', base:'images/idx-residential-base.jpg', video:'images/idx-residential.mp4', poster:'images/idx-residential-poster.jpg',
      title:'Residential',
      desc:'Projects include 2 highrise residential projects. One of which is a mixed used stucture.',
      link:'residential.html'
    },
    {
      key:'freelance', base:'images/idx-freelance-base.jpg', video:'images/idx-freelance.mp4', poster:'images/idx-freelance-poster.jpg',
      frame:{ py:154 },
      title:'Freelance',
      desc:'Projects include villa and club house design and a completed interior project.',
      link:'freelance.html'
    },
    {
      key:'group', base:'images/idx-group-base.jpg', video:'images/idx-group.mp4', poster:'images/idx-group-poster.jpg',
      title:'Group Projects',
      desc:'Nari gandhi citation wining project included also doccumentation of Nepal after the earthquake and Varanasi Ghats.',
      link:'group.html'
    },
    {
      key:'misc', base:'images/idx-misc-base.jpg', video:'images/idx-misc.mp4', poster:'images/idx-misc-poster.jpg',
      frame:{ cw:774, px:71, py:154, pw:703 },
      title:'Miscellaneous',
      desc:'Few of my achivements to highlight other aspects of myself to date.',
      link:'misc.html'
    }
  ];

  const indexSection = document.getElementById('indexSection');
  const canHover = window.matchMedia('(hover: hover)').matches;

  function resetActiveTiles(){
    document.querySelectorAll('.index-col.is-active').forEach(el => {
      el.classList.remove('is-active');
      const v = el.querySelector('.idx-video');
      if(v){ v.pause(); v.currentTime = 0; }
    });
  }

  indexCategories.forEach(cat => {
    const col = document.createElement('div');
    col.className = cat.video ? 'index-col has-video' : 'index-col';
    // a tile's video replaces its hover image; its poster is the video's own first frame.
    // frame overrides the default canvas/panel geometry (see .idx-video) for odd-sized exports
    const frameVars = cat.frame ? Object.entries(cat.frame).map(([k, v]) => '--' + k + ':' + v).join(';') : '';
    const reveal = cat.video
      ? '<video class="idx-video" style="' + frameVars + '" src="' + cat.video + '" poster="' + cat.poster + '" muted playsinline preload="auto" aria-hidden="true"></video>'
      : '<img class="idx-hover" src="' + cat.hover + '" alt="" loading="lazy">';
    col.innerHTML =
      '<img class="idx-base" src="' + cat.base + '" alt="" loading="lazy">' +
      reveal +
      '<span class="sr-only">' + cat.title + ' — ' + cat.desc + '</span>';

    const video = col.querySelector('.idx-video');
    if(video && canHover){
      col.addEventListener('mouseenter', () => { video.currentTime = 0; video.play().catch(() => {}); });
      col.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
    }

    col.addEventListener('click', () => {
      // touch screens can't hover: a video tile previews on the first tap and opens on the second
      if(video && !canHover && !col.classList.contains('is-active')){
        resetActiveTiles();
        col.classList.add('is-active');
        video.play().catch(() => {});
        return;
      }
      if(cat.link){ window.location.href = cat.link; return; }
      const wasActive = col.classList.contains('is-active');
      resetActiveTiles();
      if(!wasActive) col.classList.add('is-active');
    });
    indexSection.appendChild(col);
  });

  // coming back via Back restores the page as it was left; reset so the next tap previews again
  window.addEventListener('pageshow', (e) => { if(e.persisted) resetActiveTiles(); });
</script>

<script>
  const welcome = document.getElementById('welcome');
  const timelineSection = document.getElementById('timelineSection');
  const timelineTrack = document.getElementById('timelineTrack');

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
  const isMobileLayout = () => window.matchMedia('(max-width:768px)').matches;

  function onScroll(){
    const vh = window.innerHeight;

    // hero (photo + skills band live inside #welcome together) fades out over its own
    // rendered height as the user scrolls past it, keeping the band in sync with the photo;
    // using the element's own height (not just vh) keeps this correct on mobile, where the
    // band sits below a full-height photo and #welcome is taller than one viewport
    const heroProgress = clamp(window.scrollY / welcome.offsetHeight, 0, 1);
    welcome.style.opacity = String(1 - heroProgress);

    // desktop/tablet only: pin the section and pan the track based on scroll position.
    // on mobile the CSS switches this to a native horizontally-swipeable strip instead.
    if(isMobileLayout()){
      timelineTrack.style.transform = '';
      return;
    }

    const rect = timelineSection.getBoundingClientRect();
    const scrollable = timelineSection.offsetHeight - vh;
    const progress = clamp(-rect.top / scrollable, 0, 1);

    const maxTranslate = Math.max(0, timelineTrack.offsetWidth - window.innerWidth);
    timelineTrack.style.transform = 'translateX(' + (-progress * maxTranslate) + 'px)';
  }

  // ---------- timeline reveal: plays once when it comes into view, then rests on its final frame ----------
  const timelineVideo = document.getElementById('timelineVideo');

  function showFinalFrame(){
    const seekToEnd = () => { timelineVideo.currentTime = timelineVideo.duration; };
    if(timelineVideo.readyState >= 1) seekToEnd();
    else timelineVideo.addEventListener('loadedmetadata', seekToEnd, { once:true });
  }

  const revealObserver = new IntersectionObserver((entries) => {
    if(!entries.some(e => e.isIntersecting)) return;
    revealObserver.disconnect();
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ showFinalFrame(); return; }
    timelineVideo.defaultPlaybackRate = timelineVideo.playbackRate = 0.75;
    // if autoplay is blocked (e.g. iOS Low Power Mode), show the finished timeline rather than a blank frame
    timelineVideo.play().catch(showFinalFrame);
  }, { threshold:0.4 });
  revealObserver.observe(document.querySelector('.timeline-sticky'));

  // ---------- skills band: rings fill 0 -> score once the band is in view AND the hero
  // intro (the name-line slide-up) has finished, so it never competes with the intro ----------
  (function initSkillsBand(){
    const skillsList = document.getElementById('skillsList');
    const skillsBand = document.getElementById('skillsBand');
    if(!skillsList || !skillsBand) return;

    const skillItems = Array.from(skillsList.querySelectorAll('.skill'));
    const RING_R = 42;
    const RING_CIRC = 2 * Math.PI * RING_R;
    const STAGGER = 90;   // ms between each ring starting
    const DURATION = 1350; // ms each ring takes to fill

    // reduced motion: the markup already renders every ring/number at its final score,
    // so there is nothing to do here — leave that final state exactly as authored.
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }

    // start every ring at 0 (overriding the pre-rendered final markup) so it has
    // somewhere to animate from once triggered
    skillItems.forEach(li => {
      const circle = li.querySelector('.ring-progress');
      circle.style.strokeDasharray = String(RING_CIRC);
      circle.style.strokeDashoffset = String(RING_CIRC);
      const numEl = li.querySelector('.score-num');
      if(numEl) numEl.textContent = '0';
    });

    let heroIntroDone = false;
    let bandInView = false;
    let played = false;

    function maybePlay(){
      if(played || !heroIntroDone || !bandInView) return;
      played = true;
      runAnimation();
    }

    function runAnimation(){
      const startTime = performance.now();
      function frame(now){
        let running = false;
        skillItems.forEach((li, i) => {
          const t = now - startTime - i * STAGGER;
          if(t < 0){ running = true; return; }
          const p = Math.min(1, t / DURATION);
          if(p < 1) running = true;
          const score = parseFloat(li.dataset.score);
          const value = easeOutCubic(p) * score;
          li.querySelector('.ring-progress').style.strokeDashoffset = String(RING_CIRC * (1 - value / 10));
          const numEl = li.querySelector('.score-num');
          if(numEl) numEl.textContent = String(Math.round(value));
        });
        if(running){
          requestAnimationFrame(frame);
        } else {
          // snap every ring/number to its exact final value, clear of any rounding drift
          skillItems.forEach(li => {
            const score = parseFloat(li.dataset.score);
            li.querySelector('.ring-progress').style.strokeDashoffset = String(RING_CIRC * (1 - score / 10));
            const numEl = li.querySelector('.score-num');
            if(numEl) numEl.textContent = String(score);
          });
        }
      }
      requestAnimationFrame(frame);
    }

    // real "hero intro finished" signal: the name-line is the last piece of the intro
    // to animate in (see .name-line's slideUp), so its animationend marks the intro's end
    const nameLine = document.querySelector('.name-line');
    if(nameLine){
      nameLine.addEventListener('animationend', () => { heroIntroDone = true; maybePlay(); }, { once:true });
    } else {
      heroIntroDone = true;
    }

    const bandObserver = new IntersectionObserver((entries) => {
      if(!entries.some(e => e.isIntersecting)) return;
      bandObserver.disconnect();
      bandInView = true;
      maybePlay();
    }, { threshold:0.3 });
    bandObserver.observe(skillsBand);
  })();

  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', onScroll);
  onScroll();
</script>
