<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ar. Kshitij Shetty — Architect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --text:#141414;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:var(--bg); height:100%; }
  body{
    color:var(--text);
    font-family:'Playfair Display', serif;
    overflow-x:hidden;
  }

  .welcome{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh; /* avoids iOS/Android address-bar resize jump */
    overflow:hidden;
  }

  .welcome-frame{
    position:relative;
    width:100%;
    height:100%;
  }

  .welcome-frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    animation:fadeInImage 3.6s ease-out forwards;
  }

  .welcome-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 78%, #fff 100%);
    pointer-events:none;
  }

  @keyframes fadeInImage{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  .welcome-text{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:clamp(48px, 9vh, 140px);
    text-align:center;
    pointer-events:none;
    color:#fff;
  }

  .text-block{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 64px;
  }

  .eyebrow-line{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    opacity:0;
    transform:translateY(40px);
    animation:slideUp 1.8s cubic-bezier(.16,1,.3,1) 1.6s forwards;
  }
  .eyebrow-line .bar{
    width:1px;
    height:1.4em;
    background:rgba(255,255,255,.65);
  }
  .eyebrow-line span{
    font-size:clamp(1.3rem, 2.5vw, 2.1rem);
    font-weight:400;
    letter-spacing:.02em;
    white-space:nowrap;
  }

  .name-line{
    position:relative;
    opacity:0;
    transform:translateY(70px);
    animation:slideUp 1.9s cubic-bezier(.16,1,.3,1) 2.1s forwards;
  }
  .name-line span{
    display:block;
    font-size:clamp(3.8rem, 12vw, 10.5rem);
    font-weight:600;
    line-height:1.05;
    letter-spacing:-.01em;
    white-space:nowrap;
  }

  @keyframes slideUp{
    from{ opacity:0; transform:translateY(60px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:640px){
    .name-line span{ font-size:clamp(2.6rem, 13vw, 4.6rem); white-space:normal; }
    .eyebrow-line span{ font-size:1.15rem; white-space:normal; }
    .text-block{ padding:24px 28px; }
  }

  /* ---------- TIMELINE (pinned horizontal pan) ---------- */
  .section-spacer{
    width:100%;
    height:22vh;
    background:#fff;
  }

  .timeline-section{
    position:relative;
    height:400vh;
    background:#fff;
  }
  .timeline-sticky{
    position:sticky;
    top:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .timeline-track{
    position:relative;
    height:100%;
    width:max-content;
    will-change:transform;
  }
  .timeline-track img{
    height:100%;
    width:auto;
    display:block;
  }

  /* ---------- MOBILE: swap scroll-jacked pan for a native swipeable strip ---------- */
  @media (max-width:768px){
    .section-spacer{ height:8vh; }

    .timeline-section{
      height:auto;
    }
    .timeline-sticky{
      position:relative;
      top:auto;
      width:100%;
      height:auto;
      overflow-x:auto;
      overflow-y:hidden;
      -webkit-overflow-scrolling:touch;
      scroll-snap-type:x proximity;
      scrollbar-width:none;
    }
    .timeline-sticky::-webkit-scrollbar{ display:none; }
    .timeline-track{
      /* image aspect ratio ~2.4725:1 -> height set so the viewport shows ~40% of its width at start */
      height:calc(100vw / 0.989);
    }
    .timeline-track img{
      scroll-snap-align:start;
    }
  }

  /* ---------- MAIN INDEX ---------- */
  .index-section{
    display:flex;
    width:100%;
    height:100vh;
    height:100dvh;
    gap:clamp(10px, 1.6vw, 26px);
    background:#fff;
    padding:0 clamp(10px, 1.6vw, 26px);
  }
  .index-col{
    flex:1;
    position:relative;
    background:var(--col-color);
    overflow:hidden;
    cursor:pointer;
  }
  .index-col img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:top center;
    display:block;
  }
  .index-col .idx-base{
    opacity:1;
  }
  .index-col .idx-hover{
    opacity:0;
    transition:opacity .5s ease;
  }
  .index-col:hover .idx-hover,
  .index-col.is-active .idx-hover{
    opacity:1;
  }
  .index-col:active .idx-hover{
    opacity:.85;
    transition:opacity .1s ease;
  }
  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @media (max-width:900px){
    .index-section{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      grid-auto-rows:auto;
      height:auto;
      gap:8px;
      padding:8px;
    }
    .index-col{
      aspect-ratio:706 / 2850; /* same proportions as the source index artwork - no cropping needed */
      min-height:0;
    }
    .index-col img{
      object-position:top center;
    }
  }
</style>
</head>
<body>

  <section class="welcome" id="welcome">
    <div class="welcome-frame">
      <img src="images/hero-welcome.webp" alt="Kshitij Shetty working with a community school on a participatory design project">
      <div class="welcome-fade"></div>
      <div class="welcome-text">
        <div class="text-block">
          <div class="eyebrow-line">
            <div class="bar"></div>
            <span>Professional Portfolio</span>
          </div>
          <div class="name-line">
            <span>Ar.Kshitij Shetty</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="section-spacer"></div>

  <section class="timeline-section" id="timelineSection">
    <div class="timeline-sticky">
      <div class="timeline-track" id="timelineTrack">
        <img src="images/timeline.webp" alt="Career timeline — Ar. Kshitij Shetty, 2016 to 2026" id="timelineImg">
      </div>
    </div>
  </section>

  <section class="index-section" id="indexSection"></section>

<script>
  const indexCategories = [
    {
      key:'thesis', base:'images/idx-thesis-base.jpg', hover:'images/idx-thesis.jpg',
      title:'Thesis',
      desc:'Final thesis was a detail study of religion and its structures. Understanding and an attempt to create a space with a joint true meaning.'
    },
    {
      key:'commercial', base:'images/idx-commercial-base.jpg', hover:'images/idx-commercial.jpg',
      title:'Commercial',
      desc:'Projects include an I.T park with an expansive podium landscape and also project with small pockets of green spaces created in space constraints.'
    },
    {
      key:'residential', base:'images/idx-residential-base.jpg', hover:'images/idx-residential.jpg',
      title:'Residential',
      desc:'Projects include 2 highrise residential projects. One of which is a mixed used stucture.'
    },
    {
      key:'freelance', base:'images/idx-freelance-base.jpg', hover:'images/idx-freelance.jpg',
      title:'Freelance',
      desc:'Projects include villa and club house design and a completed interior project.'
    },
    {
      key:'group', base:'images/idx-group-base.jpg', hover:'images/idx-group.jpg',
      title:'Group Projects',
      desc:'Nari gandhi citation wining project included also doccumentation of Nepal after the earthquake and Varanasi Ghats.'
    },
    {
      key:'misc', base:'images/idx-misc-base.jpg', hover:'images/idx-misc.jpg',
      title:'Miscellaneous',
      desc:'Few of my achivements to highlight other aspects of myself to date.'
    }
  ];

  const indexSection = document.getElementById('indexSection');
  indexCategories.forEach(cat => {
    const col = document.createElement('div');
    col.className = 'index-col';
    col.innerHTML =
      '<img class="idx-base" src="' + cat.base + '" alt="">' +
      '<img class="idx-hover" src="' + cat.hover + '" alt="">' +
      '<span class="sr-only">' + cat.title + ' — ' + cat.desc + '</span>';
    col.addEventListener('click', () => {
      const wasActive = col.classList.contains('is-active');
      document.querySelectorAll('.index-col.is-active').forEach(el => el.classList.remove('is-active'));
      if(!wasActive) col.classList.add('is-active');
    });
    indexSection.appendChild(col);
  });
</script>

<script>
  const welcome = document.getElementById('welcome');
  const timelineSection = document.getElementById('timelineSection');
  const timelineTrack = document.getElementById('timelineTrack');

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
  const isMobileLayout = () => window.matchMedia('(max-width:768px)').matches;

  function onScroll(){
    const vh = window.innerHeight;

    // hero fades out to white over its own height as the user scrolls past it
    const heroProgress = clamp(window.scrollY / vh, 0, 1);
    welcome.style.opacity = String(1 - heroProgress);

    // desktop/tablet only: pin the section and pan the track based on scroll position.
    // on mobile the CSS switches this to a native horizontally-swipeable strip instead,
    // so the scroll-jacking transform below is skipped entirely.
    if(isMobileLayout()){
      timelineTrack.style.transform = '';
      return;
    }

    const rect = timelineSection.getBoundingClientRect();
    const scrollable = timelineSection.offsetHeight - vh;
    const raw = -rect.top;
    const progress = clamp(raw / scrollable, 0, 1);

    const vw = window.innerWidth;
    const maxTranslate = Math.max(0, timelineImgWidth - vw);
    timelineTrack.style.transform = 'translateX(' + (-progress * maxTranslate) + 'px)';
  }

  const timelineImg = document.getElementById('timelineImg');
  let timelineImgWidth = 0;
  function measureImg(){
    timelineImgWidth = timelineImg.getBoundingClientRect().width;
    onScroll();
  }
  if(timelineImg.complete){ measureImg(); } else { timelineImg.addEventListener('load', measureImg); }

  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', measureImg);
  onScroll();
</script>

</body>
</html>
