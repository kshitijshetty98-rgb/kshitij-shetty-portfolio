<style>
  :root{
    --bg:#ffffff;
    --text:#141414;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:var(--bg); height:100%; }
  body{
    color:var(--text);
    font-family:'Playfair Display', serif;
    overflow-x:hidden;
  }

  .welcome{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh; /* avoids iOS/Android address-bar resize jump */
    overflow:hidden;
  }

  .welcome-frame{
    position:relative;
    width:100%;
    height:100%;
  }

  .welcome-frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    animation:fadeInImage 3.6s ease-out forwards;
  }

  .hero-mobile{ display:none; }

  @media (max-width:768px){
    .hero-desktop{ display:none; }
    .hero-mobile{
      display:block;
      object-position:center 18%; /* keep faces/paper-cutouts in frame on tall phone screens */
    }
  }

  .welcome-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 78%, #fff 100%);
    pointer-events:none;
  }

  @keyframes fadeInImage{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  .welcome-text{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:clamp(48px, 9vh, 140px);
    text-align:center;
    pointer-events:none;
    color:#fff;
  }

  .text-block{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 64px;
  }

  .eyebrow-line{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    opacity:0;
    transform:translateY(40px);
    animation:slideUp 1.8s cubic-bezier(.16,1,.3,1) 1.6s forwards;
  }
  .eyebrow-line .bar{
    width:1px;
    height:1.4em;
    background:rgba(255,255,255,.65);
  }
  .eyebrow-line span{
    font-size:clamp(1.3rem, 2.5vw, 2.1rem);
    font-weight:400;
    letter-spacing:.02em;
    white-space:nowrap;
  }

  .name-line{
    position:relative;
    opacity:0;
    transform:translateY(70px);
    animation:slideUp 1.9s cubic-bezier(.16,1,.3,1) 2.1s forwards;
  }
  .name-line span{
    display:block;
    font-size:clamp(3.8rem, 12vw, 10.5rem);
    font-weight:600;
    line-height:1.05;
    letter-spacing:-.01em;
    white-space:nowrap;
  }

  @keyframes slideUp{
    from{ opacity:0; transform:translateY(60px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:640px){
    .name-line span{ font-size:clamp(2.6rem, 13vw, 4.6rem); white-space:normal; }
    .eyebrow-line span{ font-size:1.15rem; white-space:normal; }
    .text-block{ padding:24px 28px; }
  }

  /* ---------- TIMELINE (pinned horizontal pan) ---------- */
  .section-spacer{
    width:100%;
    height:22vh;
    background:#fff;
  }

  .timeline-section{
    position:relative;
    height:400vh;
    background:#fff;
  }
  .timeline-sticky{
    position:sticky;
    top:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .timeline-track{
    position:relative;
    height:100%;
    width:max-content;
    will-change:transform;
  }
  .timeline-track video{
    height:100%;
    width:auto;
    display:block;
  }

  /* ---------- MOBILE: swap scroll-jacked pan for a native swipeable strip;
     the strip's own scrollLeft scrubs the video instead of window scrollY ---------- */
  @media (max-width:768px){
    .section-spacer{ height:2vh; }

    .timeline-section{
      height:auto;
    }
    .timeline-sticky{
      position:relative;
      top:auto;
      width:100%;
      height:auto;
      overflow-x:auto;
      overflow-y:hidden;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .timeline-sticky::-webkit-scrollbar{ display:none; }
    .timeline-track{
      /* 200% scale = 2x original size -> ~20% of width visible at start */
      height:calc(100vw / 0.4945);
    }
  }

  /* ---------- MAIN INDEX ---------- */
  /* gaps/side padding are sized to (just over) a tile video's white left margin
     (86/704 of the tile width), so a video's margin fills its own gap without
     painting over the neighbouring tile */
  .index-section{
    display:flex;
    width:100%;
    height:100vh;
    height:100dvh;
    gap:1.875%;
    background:#fff;
    padding:0 1.81%;
  }
  .index-col{
    flex:1;
    position:relative;
    background:var(--col-color);
    overflow:hidden;
    cursor:pointer;
  }
  .index-col img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:top center;
    display:block;
  }
  /* video tiles: the video canvas (790x3004) has a white margin left and above the
     tile panel (panel at x=86, y=153, 704 wide). Size/offset it so the panel lands
     exactly on the tile and the margin hangs outside, letting the pop-up art spill
     past the tile's left/top edges; the right/bottom edges still clip. */
  .index-col.has-video{
    overflow:visible;
    clip-path:inset(-100vh 0 0 -100vw);
  }
  .index-col .idx-video{
    position:absolute;
    top:0;
    left:calc(-86 / 704 * 100%);
    width:calc(790 / 704 * 100%);
    height:auto;
    aspect-ratio:790 / 3004;
    margin-top:calc(-153 / 704 * 100%); /* % margins resolve against width, like left */
    display:block;
    pointer-events:none;
  }
  .index-col .idx-base{
    opacity:1;
  }
  .index-col .idx-hover{
    opacity:0;
    transition:opacity .5s ease;
  }
  .index-col:hover .idx-hover,
  .index-col.is-active .idx-hover{
    opacity:1;
  }
  @media (hover:hover) and (pointer:fine){
    .index-col:active .idx-hover{
      opacity:.85;
      transition:opacity .1s ease;
    }
  }
  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @media (max-width:900px){
    /* column gaps fit a video's left margin; row gap and top padding fit its top
       margin (153/704 of the tile width), so row 2's upward spill clears row 1 */
    .index-section{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      grid-auto-rows:auto;
      height:auto;
      column-gap:3.82%;
      row-gap:6.3vw;
      padding:6.3vw 3.65% 3.65%;
    }
    .index-col{
      aspect-ratio:706 / 2850; /* same proportions as the source index artwork - no cropping needed */
      min-height:0;
    }
    .index-col img{
      object-position:top center;
    }
  }

  /* ---------- CONTACT ---------- */
  .contact{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:var(--bg);
    padding:10vh 6vw;
    margin-top:clamp(40px, 7vh, 110px);
    overflow:hidden;
  }
  .contact-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .contact-scrim{
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.55);
    z-index:0;
  }
  .contact-fade-top{
    position:absolute;
    top:0; left:0; right:0;
    height:16%;
    background:linear-gradient(to bottom, #fff 0%, rgba(255,255,255,0) 100%);
    z-index:0;
    pointer-events:none;
  }
  .contact-inner{ position:relative; z-index:1; max-width:900px; }
  .contact-eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    font-size:clamp(.85rem, 1.3vw, 1.1rem);
    letter-spacing:.02em;
    color:var(--text);
    margin-bottom:16px;
  }
  .contact-eyebrow .bar{
    width:1px;
    height:1.2em;
    background:var(--text);
    opacity:.5;
  }
  .contact-email{
    display:inline-block;
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(1.8rem, 5vw, 3.6rem);
    color:var(--text);
    text-decoration:none;
    border-bottom:2px solid transparent;
    transition:border-color .3s ease;
  }

  @media (max-width:640px){
    .contact-email{
      font-size:clamp(1.3rem, 6.8vw, 2rem);
      white-space:nowrap;
    }
  }
  .contact-email:hover{
    border-color:var(--text);
  }
</style>
</head>
<body>

  <section class="welcome" id="welcome">
    <div class="welcome-frame">
      <img class="hero-desktop" src="images/hero-welcome.webp" alt="Kshitij Shetty working with a community school on a participatory design project">
      <img class="hero-mobile" src="images/hero-mobile.jpg" alt="Kshitij Shetty working with a community school on a participatory design project">
      <div class="welcome-fade"></div>
      <div class="welcome-text">
        <div class="text-block">
          <div class="eyebrow-line">
            <div class="bar"></div>
            <span>Professional Portfolio</span>
          </div>
          <div class="name-line">
            <span>Ar.Kshitij Shetty</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="section-spacer"></div>

  <section class="timeline-section" id="timelineSection">
    <div class="timeline-sticky">
      <div class="timeline-track" id="timelineTrack">
        <video src="images/timeline.mp4" id="timelineVideo" width="2560" height="1010" muted playsinline preload="auto" aria-label="Career timeline — Ar. Kshitij Shetty, 2016 to 2026"></video>
      </div>
    </div>
  </section>

  <section class="index-section" id="indexSection"></section>

  <section class="contact" id="contact">
    <img class="contact-bg" src="images/contact-bg.jpg" alt="" loading="lazy">
    <div class="contact-scrim"></div>
    <div class="contact-fade-top"></div>
    <div class="contact-inner">
      <div class="contact-eyebrow">
        <div class="bar"></div>
        <span>Get in Touch</span>
      </div>
      <a class="contact-email" href="mailto:kshitijshetty98@gmail.com">kshitijshetty98@gmail.com</a>
    </div>
  </section>

<script>
  const indexCategories = [
    {
      key:'thesis', base:'images/idx-thesis-base.jpg', video:'images/idx-thesis.mp4', poster:'images/idx-thesis-poster.jpg',
      title:'Thesis',
      desc:'Final thesis was a detail study of religion and its structures. Understanding and an attempt to create a space with a joint true meaning.',
      link:'thesis.html'
    },
    {
      key:'commercial', base:'images/idx-commercial-base.jpg', video:'images/idx-commercial.mp4', poster:'images/idx-commercial-poster.jpg',
      title:'Commercial',
      desc:'Projects include an I.T park with an expansive podium landscape and also project with small pockets of green spaces created in space constraints.',
      link:'commercial.html'
    },
    {
      key:'residential', base:'images/idx-residential-base.jpg', video:'images/idx-residential.mp4', poster:'images/idx-residential-poster.jpg',
      title:'Residential',
      desc:'Projects include 2 highrise residential projects. One of which is a mixed used stucture.',
      link:'residential.html'
    },
    {
      key:'freelance', base:'images/idx-freelance-base.jpg', hover:'images/idx-freelance.jpg',
      title:'Freelance',
      desc:'Projects include villa and club house design and a completed interior project.',
      link:'freelance.html'
    },
    {
      key:'group', base:'images/idx-group-base.jpg', hover:'images/idx-group.jpg',
      title:'Group Projects',
      desc:'Nari gandhi citation wining project included also doccumentation of Nepal after the earthquake and Varanasi Ghats.',
      link:'group.html'
    },
    {
      key:'misc', base:'images/idx-misc-base.jpg', hover:'images/idx-misc.jpg',
      title:'Miscellaneous',
      desc:'Few of my achivements to highlight other aspects of myself to date.',
      link:'misc.html'
    }
  ];

  const indexSection = document.getElementById('indexSection');
  const canHover = window.matchMedia('(hover: hover)').matches;

  function resetActiveTiles(){
    document.querySelectorAll('.index-col.is-active').forEach(el => {
      el.classList.remove('is-active');
      const v = el.querySelector('.idx-video');
      if(v){ v.pause(); v.currentTime = 0; }
    });
  }

  indexCategories.forEach(cat => {
    const col = document.createElement('div');
    col.className = cat.video ? 'index-col has-video' : 'index-col';
    // a tile's video replaces its hover image; its poster is the video's own first frame
    const reveal = cat.video
      ? '<video class="idx-video" src="' + cat.video + '" poster="' + cat.poster + '" muted playsinline preload="auto" aria-hidden="true"></video>'
      : '<img class="idx-hover" src="' + cat.hover + '" alt="" loading="lazy">';
    col.innerHTML =
      '<img class="idx-base" src="' + cat.base + '" alt="" loading="lazy">' +
      reveal +
      '<span class="sr-only">' + cat.title + ' — ' + cat.desc + '</span>';

    const video = col.querySelector('.idx-video');
    if(video && canHover){
      col.addEventListener('mouseenter', () => { video.currentTime = 0; video.play().catch(() => {}); });
      col.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
    }

    col.addEventListener('click', () => {
      // touch screens can't hover: a video tile previews on the first tap and opens on the second
      if(video && !canHover && !col.classList.contains('is-active')){
        resetActiveTiles();
        col.classList.add('is-active');
        video.play().catch(() => {});
        return;
      }
      if(cat.link){ window.location.href = cat.link; return; }
      const wasActive = col.classList.contains('is-active');
      resetActiveTiles();
      if(!wasActive) col.classList.add('is-active');
    });
    indexSection.appendChild(col);
  });

  // coming back via Back restores the page as it was left; reset so the next tap previews again
  window.addEventListener('pageshow', (e) => { if(e.persisted) resetActiveTiles(); });
</script>

<script>
  const welcome = document.getElementById('welcome');
  const timelineSection = document.getElementById('timelineSection');
  const timelineTrack = document.getElementById('timelineTrack');

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
  const isMobileLayout = () => window.matchMedia('(max-width:768px)').matches;

  function onScroll(){
    const vh = window.innerHeight;

    // hero fades out to white over its own height as the user scrolls past it
    const heroProgress = clamp(window.scrollY / vh, 0, 1);
    welcome.style.opacity = String(1 - heroProgress);

    // desktop/tablet only: pin the section and pan the track based on scroll position.
    // on mobile the CSS switches this to a native horizontally-swipeable strip instead.
    if(isMobileLayout()){
      timelineTrack.style.transform = '';
      return;
    }

    const rect = timelineSection.getBoundingClientRect();
    const scrollable = timelineSection.offsetHeight - vh;
    const progress = clamp(-rect.top / scrollable, 0, 1);

    const maxTranslate = Math.max(0, timelineTrack.offsetWidth - window.innerWidth);
    timelineTrack.style.transform = 'translateX(' + (-progress * maxTranslate) + 'px)';
  }

  // ---------- timeline reveal: plays once when it comes into view, then rests on its final frame ----------
  const timelineVideo = document.getElementById('timelineVideo');

  function showFinalFrame(){
    const seekToEnd = () => { timelineVideo.currentTime = timelineVideo.duration; };
    if(timelineVideo.readyState >= 1) seekToEnd();
    else timelineVideo.addEventListener('loadedmetadata', seekToEnd, { once:true });
  }

  const revealObserver = new IntersectionObserver((entries) => {
    if(!entries.some(e => e.isIntersecting)) return;
    revealObserver.disconnect();
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ showFinalFrame(); return; }
    timelineVideo.defaultPlaybackRate = timelineVideo.playbackRate = 0.75;
    // if autoplay is blocked (e.g. iOS Low Power Mode), show the finished timeline rather than a blank frame
    timelineVideo.play().catch(showFinalFrame);
  }, { threshold:0.4 });
  revealObserver.observe(document.querySelector('.timeline-sticky'));

  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', onScroll);
  onScroll();
</script>

</body>
