<style>
  :root{
    --bg:#ffffff;
    --text:#141414;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:var(--bg); }
  body{
    color:var(--text);
    font-family:'Playfair Display', serif;
    overflow-x:hidden;
  }

  .back-link{
    position:fixed;
    top:16px;
    left:16px;
    z-index:20;
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:44px;
    padding:10px 18px;
    border-radius:999px;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    box-shadow:0 2px 14px rgba(0,0,0,.14);
    font-size:.85rem;
    letter-spacing:.04em;
    color:#141414;
    text-decoration:none;
    transition:opacity .35s ease, transform .35s ease;
  }
  .back-link:hover{ background:rgba(255,255,255,.95); }
  .back-link.is-hidden{
    opacity:0;
    transform:translateY(-10px);
    pointer-events:none;
  }
  .back-link:focus-visible{
    opacity:1;
    transform:none;
    pointer-events:auto;
    outline:2px solid #141414;
    outline-offset:2px;
  }

  .thesis-hero{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:#000;
    overflow:hidden;
  }
  .thesis-hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:scale(1.004); /* closes a subpixel rounding seam that can show at the contain-fit edge */
  }
  .thesis-hero-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 78%, #fff 100%);
    pointer-events:none;
  }

  /* unlike the other hero artworks, this one's canvas is the same terracotta
     family at both its left AND right edges (confirmed by sampling the file
     directly — there's no baked-in white panel here), so a single flat
     background-colour already matches on every side at any aspect ratio;
     switching to white past a threshold would introduce the mismatch instead
     of preventing one, so that switch has been removed. */
  #groupHero{ background:#874b4b; }

  .hero-title{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:2;
    margin:0;
    width:92%;
    text-align:center;
    line-height:1;
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-size:clamp(2.6rem, 11vw, 9rem);
    letter-spacing:.03em;
    color:#fff;
    text-shadow:0 4px 34px rgba(0,0,0,.3);
  }

  .thesis-board{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .thesis-board img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  @media (max-width:768px){
    .thesis-board{
      height:auto;
      padding:0;
    }
    .thesis-board img{
      height:auto;
      display:block;
    }
  }

  /* ---------- portrait boards, shown as side-by-side spreads to match the
     landscape-board density used elsewhere on this page ---------- */
  .residential-spread{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2%;
  }
  .residential-spread img{
    height:100%;
    width:auto;
    max-width:48%;
    object-fit:contain;
    display:block;
    flex:none;
  }

  @media (max-width:768px){
    .residential-spread{
      height:auto;
      display:block;
      gap:0;
    }
    .residential-spread img{
      width:100%;
      max-width:100%;
      height:auto;
    }
  }

  /* ---------- slide decks (Rammed Chair, etc.): a landscape board whose slide
     image keeps its exact aspect ratio so absolutely-positioned video/GIF
     overlays can be placed with percentages that always land on the right
     pixels of the slide, at any viewport size ----------
     Sized (not just eyeballed) so the slides' visible artwork lines up with
     the L.O.O.P. boards below: the boards' own on-screen width isn't a flat
     % of viewport -- .thesis-board's height:100vh + object-fit:contain make
     it width-constrained on some viewports and height-constrained on others,
     since a board's ~1.41 aspect ratio is narrower than a 16:9 slide's. The
     frame's width is min(95.01vw, 75.34vh * 16/9): the first term reproduces
     the boards' median content width when both are width-constrained (mobile
     / narrow viewports), the second when the boards go height-constrained on
     wide/short viewports (same 95.01% / 75.34% figures the original flat
     width%/max-height% rule used -- see rammed-width/compute-fix.js -- just
     computed directly instead of via max-height+aspect-ratio, which clamps
     the auto height but leaves an explicit width alone, so on wide desktop
     viewports it silently broke the frame's 16:9 shape and threw off every
     overlay's position and object-fit:cover crop). Height is left to
     aspect-ratio so the frame always stays exactly == the image's own box,
     which the overlay percentages below depend on. Rammed boards themselves
     are height:auto (not the shared 100vh .thesis-board default) so slides
     stack with no gap; L.O.O.P. boards are untouched. */
  .thesis-board:has(.rammed-frame){
    height:auto;
  }
  .thesis-board .rammed-frame{
    position:relative;
    width:min(95.01vw, calc(75.34vh * 16 / 9));
    max-width:min(95.01vw, calc(75.34vh * 16 / 9));
    aspect-ratio:1.777778;
  }
  .thesis-board .rammed-frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .thesis-board .rammed-frame video.rammed-media{
    position:absolute;
    object-fit:cover;
    background:#000;
  }
  /* breathing room at the section joins the gap removal above would otherwise
     close flush: hero -> first Rammed slide, last Rammed slide -> first
     Robotics slide, last Robotics slide -> first L.O.O.P. board. Generalised
     from the original #rammedFirst/#rammedLast ids into reusable classes so
     any slide deck's boundary can opt in the same way. Chosen small and
     viewport-relative, well under the letterboxing L.O.O.P. boards already
     show themselves at narrower shapes. Only one side of each boundary needs
     the margin (adjacent block margins collapse to the max, not the sum), so
     e.g. Rammed's own last-slide margin-bottom already creates the full gap
     to whatever deck follows it -- that next deck's first slide doesn't also
     need margin-top. */
  .slide-deck-first{ margin-top:6vh; }
  .slide-deck-last{ margin-bottom:6vh; }

  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  .page-end-nav{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    max-width:1100px;
    margin:0 auto;
    padding:9vh 6vw 5vh;
  }
  .page-end-link{
    display:inline-flex;
    flex-direction:column;
    gap:6px;
    color:var(--text);
    text-decoration:none;
  }
  .page-end-link.next{ margin-left:auto; text-align:right; }
  .page-end-eyebrow{
    font-size:.75rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    opacity:.5;
  }
  .page-end-name{
    font-size:clamp(1.2rem, 2.6vw, 1.7rem);
    font-weight:500;
    transition:opacity .3s ease;
  }
  .page-end-link:hover .page-end-name{ opacity:.6; }

  .site-footer{
    text-align:center;
    padding:4vh 6vw 9vh;
  }
  .site-footer p{ margin:0 0 8px; }
  .site-footer-name{ font-size:1rem; font-weight:500; }
  .site-footer-links{ font-size:.85rem; opacity:.75; }
  .site-footer-links a{ color:var(--text); text-decoration:none; border-bottom:1px solid transparent; }
  .site-footer-links a:hover{ border-color:var(--text); }
  .site-footer-links .sep{ margin:0 8px; opacity:.5; }
  .site-footer-copyright{ font-size:.75rem; opacity:.5; margin-bottom:0; }

  @media (prefers-reduced-motion: reduce){
    .back-link{ transition:none; }
  }
</style>

<script>
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setupHeroFade(heroEl){
    if(!heroEl || prefersReducedMotion) return;
    function onScroll(){
      const vh = window.innerHeight;
      const start = heroEl.offsetTop;
      const progress = Math.max(0, Math.min(1, (window.scrollY - start) / vh));
      heroEl.style.opacity = String(1 - progress);
    }
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
  }
  setupHeroFade(document.getElementById('groupHero'));

  // back pill: hide while scrolling down, reveal on scroll up or near the top
  (function setupBackLinkAutohide(){
    const link = document.querySelector('.back-link');
    if(!link) return;
    let lastY = window.scrollY;
    function onBackScroll(){
      const y = window.scrollY;
      if(y < 80 || y < lastY){
        link.classList.remove('is-hidden');
      } else {
        link.classList.add('is-hidden');
      }
      lastY = y;
    }
    window.addEventListener('scroll', onBackScroll, { passive:true });
  })();

  // Rammed Chair slide videos: play while a clip is scrolled into view, pause
  // when it isn't, and leave the poster frame showing for reduced-motion users
  // or whenever play() is blocked.
  (function setupRammedMedia(){
    const clips = document.querySelectorAll('video.rammed-media');
    if(!clips.length) return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const v = entry.target;
        if(entry.isIntersecting){
          const p = v.play();
          if(p && p.catch) p.catch(() => {});
        } else {
          v.pause();
        }
      });
    }, { threshold: 0.25 });
    clips.forEach((v) => io.observe(v));
  })();

  // came from the homepage: step back in history so the browser restores the exact
  // scroll position; otherwise the link's href lands on the project grid
  document.querySelector('.back-link').addEventListener('click', (e) => {
    const home = new URL('./', location.href).pathname;
    const from = document.referrer ? new URL(document.referrer) : null;
    const cameFromHome = from && from.origin === location.origin &&
      (from.pathname === home || from.pathname === home + 'index.html');
    if(cameFromHome && history.length > 1){
      e.preventDefault();
      history.back();
    }
  });
</script>
