  :root{

  *{ box-sizing:border-box; margin:0; padding:0; }

  .back-link{
    position:fixed;
    top:16px;
    left:16px;
    z-index:20;
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:44px;
    padding:10px 18px;
    border-radius:999px;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    box-shadow:0 2px 14px rgba(0,0,0,.14);
    font-size:.85rem;
    letter-spacing:.04em;
    color:#141414;
    text-decoration:none;
    transition:opacity .35s ease, transform .35s ease;
  }
  .back-link:hover{ background:rgba(255,255,255,.95); }
  .back-link.is-hidden{
    opacity:0;
    transform:translateY(-10px);
    pointer-events:none;
  }
  .back-link:focus-visible{
    opacity:1;
    transform:none;
    pointer-events:auto;
    outline:2px solid #141414;
    outline-offset:2px;
  }

  .thesis-hero{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:#000;
    overflow:hidden;
  }
  .thesis-hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:scale(1.004); /* closes a subpixel rounding seam that can show at the contain-fit edge */
  }
  .thesis-hero-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 78%, #fff 100%);
    pointer-events:none;
  }

  /* the artwork's own canvas is blue on the left, but fades to a baked-in white
     panel on its right edge (confirmed by sampling the file directly) — so when
     object-fit:contain pillarboxes on wide/short viewports, a single uniform
     background-colour can only ever match ONE side. A hard-stop split exactly at
     the midpoint always lands inside the (centred) image's own content, never in
     either pillarbox bar, so each bar reliably matches the real edge beside it at
     any aspect ratio, with no need for an aspect-ratio threshold at all. */
  #residentialHero{ background:linear-gradient(to right, #4e668c 50%, #ffffff 50%); }

  .hero-title{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:2;
    margin:0;
    width:92%;
    text-align:center;
    line-height:1;
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-size:clamp(3rem, 15vw, 12rem);
    letter-spacing:.03em;
    color:#fff;
    text-shadow:0 4px 34px rgba(0,0,0,.3);
  }

  /* ---------- portrait boards, shown as side-by-side spreads to match the
     landscape-board density used on the other project pages ---------- */
  .residential-spread{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2%;
  }
  .residential-spread img{
    height:100%;
    width:auto;
    max-width:48%;
    object-fit:contain;
    display:block;
    flex:none;
  }

  @media (max-width:768px){
    .residential-spread{
      height:auto;
      display:block;
      gap:0;
    }
    .residential-spread img{
      width:100%;
      max-width:100%;
      height:auto;
    }
  }

  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @media (prefers-reduced-motion: reduce){

<script>
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setupHeroFade(heroEl){
    if(!heroEl || prefersReducedMotion) return;
    function onScroll(){
      const vh = window.innerHeight;
      const start = heroEl.offsetTop;
      const progress = Math.max(0, Math.min(1, (window.scrollY - start) / vh));
      heroEl.style.opacity = String(1 - progress);
    }
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
  }
  setupHeroFade(document.getElementById('residentialHero'));

  // back pill: hide while scrolling down, reveal on scroll up or near the top
  (function setupBackLinkAutohide(){
    const link = document.querySelector('.back-link');
    if(!link) return;
    let lastY = window.scrollY;
    function onBackScroll(){
      const y = window.scrollY;
      if(y < 80 || y < lastY){
        link.classList.remove('is-hidden');
      } else {
        link.classList.add('is-hidden');
      }
      lastY = y;
    }
    window.addEventListener('scroll', onBackScroll, { passive:true });
  })();

  // came from the homepage: step back in history so the browser restores the exact
  // scroll position; otherwise the link's href lands on the project grid
  document.querySelector('.back-link').addEventListener('click', (e) => {
    const home = new URL('./', location.href).pathname;
    const from = document.referrer ? new URL(document.referrer) : null;
    const cameFromHome = from && from.origin === location.origin &&
      (from.pathname === home || from.pathname === home + 'index.html');
    if(cameFromHome && history.length > 1){
      e.preventDefault();
      history.back();
    }
  });
</script>
