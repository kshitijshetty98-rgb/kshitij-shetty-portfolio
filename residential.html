<style>
  :root{
    --bg:#ffffff;
    --text:#141414;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:var(--bg); }
  body{
    color:var(--text);
    font-family:'Playfair Display', serif;
    overflow-x:hidden;
  }

  .back-link{
    position:fixed;
    top:24px;
    left:24px;
    z-index:10;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:.85rem;
    letter-spacing:.04em;
    color:#f4f3ef;
    text-decoration:none;
    mix-blend-mode:difference;
  }
  .back-link:hover{ opacity:.75; }

  .thesis-hero{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:#000;
    overflow:hidden;
  }
  .thesis-hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:scale(1.004); /* closes a subpixel rounding seam that can show at the contain-fit edge */
  }
  .thesis-hero-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 78%, #fff 100%);
    pointer-events:none;
  }

  #residentialHero{ background:#4e668c; }
  /* on viewports wider (relative to height) than the artwork's own ratio, object-fit:contain
     letterboxes left/right instead of top/bottom — keep that margin clean white, not blue */
  @media (min-aspect-ratio: 1717/1000){
    #residentialHero{ background:#ffffff; }
  }

  .hero-title{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:2;
    margin:0;
    width:92%;
    text-align:center;
    line-height:1;
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-size:clamp(3rem, 15vw, 12rem);
    letter-spacing:.03em;
    color:#fff;
    text-shadow:0 4px 34px rgba(0,0,0,.3);
  }

  /* ---------- portrait boards, shown as side-by-side spreads to match the
     landscape-board density used on the other project pages ---------- */
  .residential-spread{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20%;
  }
  .residential-spread img{
    height:100%;
    width:auto;
    max-width:40%;
    object-fit:contain;
    display:block;
    flex:none;
  }

  @media (max-width:768px){
    .residential-spread{
      height:auto;
      display:block;
      gap:0;
    }
    .residential-spread img{
      width:100%;
      max-width:100%;
      height:auto;
    }
  }
</style>
</head>
<body>

  <a class="back-link" href="index.html">← Back</a>

  <section class="thesis-hero" id="residentialHero">
    <img src="images/residential-hero.jpg" alt="Residential — architecture portfolio">
    <h1 class="hero-title">Residential</h1>
    <div class="thesis-hero-fade"></div>
  </section>

  <section class="residential-spread">
    <img src="images/residential-1.jpg" loading="lazy" alt="Residential project — high-rise courtyard housing, site and ideology page 1">

<script>
  function setupHeroFade(heroEl){
    if(!heroEl) return;
    function onScroll(){
      const vh = window.innerHeight;
      const start = heroEl.offsetTop;
      const progress = Math.max(0, Math.min(1, (window.scrollY - start) / vh));
      heroEl.style.opacity = String(1 - progress);
    }
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
  }
  setupHeroFade(document.getElementById('residentialHero'));
</script>

</body>
