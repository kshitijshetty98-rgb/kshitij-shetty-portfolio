<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial — Ar. Kshitij Shetty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --text:#141414;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ background:var(--bg); }
  body{
    color:var(--text);
    font-family:'Playfair Display', serif;
    overflow-x:hidden;
  }

  .back-link{
    position:fixed;
    top:24px;
    left:24px;
    z-index:10;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:.85rem;
    letter-spacing:.04em;
    color:#f4f3ef;
    text-decoration:none;
    mix-blend-mode:difference;
  }
  .back-link:hover{ opacity:.75; }

  .thesis-hero{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:#000;
    overflow:hidden;
  }
  .thesis-hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:scale(1.004); /* closes a subpixel rounding seam that can show at the contain-fit edge */
  }
  .thesis-hero-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:38%;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.9) 78%, #fff 100%);
    pointer-events:none;
  }

  #commercialHero{ background:#faa945; }
  /* on viewports wider (relative to height) than the artwork's own ratio, object-fit:contain
     letterboxes left/right instead of top/bottom — keep that margin clean white, not orange */
  @media (min-aspect-ratio: 1723/1000){
    #commercialHero{ background:#ffffff; }
  }

  .hero-title{
    position:absolute;
    top:56px;
    left:40px;
    z-index:2;
    margin:0;
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-size:clamp(1.6rem, 3.2vw, 2.6rem);
    letter-spacing:.04em;
    color:#fff;
    text-shadow:0 2px 20px rgba(0,0,0,.2);
  }
  @media (max-width:768px){
    .hero-title{ top:88px; left:24px; font-size:1.5rem; }
  }

  .thesis-board{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .thesis-board img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  @media (max-width:768px){
    .thesis-board{
      height:auto;
      padding:0;
    }
    .thesis-board:first-of-type{
      padding-top:72px;
    }
    .thesis-board img{
      height:auto;
      display:block;
    }
  }
</style>
</head>
<body>

  <a class="back-link" href="index.html">← Back</a>

  <section class="thesis-hero" id="commercialHero">
    <img src="images/commercial-hero.jpg" alt="Commercial — architecture portfolio">
    <h1 class="hero-title">Commercial</h1>
    <div class="thesis-hero-fade"></div>
  </section>

  <section class="thesis-board">
    <img src="images/commercial-1.jpg" alt="Commercial project — Indore headquarters, staggered blocks concept">
  </section>
  <section class="thesis-board">
    <img src="images/commercial-2.jpg" alt="Commercial project — site landscaping and courtyard concept">
  </section>
  <section class="thesis-board">
    <img src="images/commercial-3.jpg" alt="Commercial project — tech park interactive spaces">
  </section>
  <section class="thesis-board">
    <img src="images/commercial-4.jpg" alt="Commercial project — Agile Baner mixed-use tower">
  </section>

<script>
  function setupHeroFade(heroEl){
    if(!heroEl) return;
    function onScroll(){
      const vh = window.innerHeight;
      const start = heroEl.offsetTop;
      const progress = Math.max(0, Math.min(1, (window.scrollY - start) / vh));
      heroEl.style.opacity = String(1 - progress);
    }
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
  }
  setupHeroFade(document.getElementById('commercialHero'));
</script>

</body>
</html>
